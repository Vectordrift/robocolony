name: Stale

on:
  schedule:
    - cron: '0 6 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been inactive for 30 days. It will be closed in 7 days unless there's new activity."
          stale-pr-message: "This PR has been inactive for 14 days. It will be closed in 7 days unless updated."
          close-issue-message: "Closed due to inactivity. Feel free to reopen if this is still relevant."
          close-pr-message: "Closed due to inactivity. Feel free to reopen with updates."
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,in-progress"
          exempt-pr-labels: "pinned,in-progress"
