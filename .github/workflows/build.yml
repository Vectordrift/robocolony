name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generate version.json
        run: |
          echo "{
            \"sha\": \"${{ github.sha }}\",
            \"short\": \"$(echo ${{ github.sha }} | cut -c1-7)\",
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"message\": $(git log -1 --pretty=format:'"%s"')
          }" > src/version.json
          cp src/version.json web/version.json

      - name: Build TypeScript
        run: npx tsc --skipLibCheck

      - name: Copy version to dist
        run: cp src/version.json dist/version.json

      - name: Commit dist/ and version files
        run: |
          git config user.name "teempai"
          git config user.email "11815232+teempai@users.noreply.github.com"
          git add dist/ web/version.json src/version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: compile dist/ [skip ci]"
            git push
          fi
