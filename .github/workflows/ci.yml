name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Don't run on commits from this workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Generate version.json
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MSG="$(git log -1 --pretty=format:'%s' | sed 's/"/\\"/g')"
          echo "{\"sha\":\"${SHA}\",\"short\":\"${SHORT}\",\"timestamp\":\"${TS}\",\"message\":\"${MSG}\"}" > version.json
          cp version.json dist/version.json
          cp version.json web/version.json

      - name: Commit compiled files
        run: |
          git config user.name "teempai"
          git config user.email "11815232+teempai@users.noreply.github.com"
          git add -f dist/ version.json web/version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: compile dist/ + version [skip ci]"
            git push
          fi
