name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Generate version.json
        run: |
          cat > version.json << VEOF
          {
            "sha": "${{ github.sha }}",
            "short": "$(echo ${{ github.sha }} | cut -c1-7)",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "message": "$(git log -1 --pretty=format:'%s' | sed 's/"/\\"/g')"
          }
          VEOF
          # Clean up leading whitespace from heredoc
          python3 -c "
          import json, sys
          with open('version.json') as f:
            d = json.load(f)
          with open('version.json', 'w') as f:
            json.dump(d, f, indent=2)
          "
          cp version.json dist/version.json
          cp version.json web/version.json

      - name: Commit compiled files
        if: github.event_name == 'push'
        run: |
          git config user.name "teempai"
          git config user.email "11815232+teempai@users.noreply.github.com"
          git add dist/ version.json web/version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: compile dist/ + version [skip ci]"
            git push
          fi
